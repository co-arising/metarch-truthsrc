# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: pipeline
id: fab-split-invoke
name: "Static Fab split Saga invocation"
description: "New contract-only parent-to-child transfer of at most 64 wafers. The target child must already exist and the manifest must be frozen before admission; child creation and processing are not implemented by this pipeline. Fixture adapters are unbound host requirements."
steps:
  [
    {
      "id": "split",
      "name": "Invoke fab-split v1",
      "description": "Invoke fab-split v1 once with durable initial Lot IDs, wafer set and frozen manifest; await Saga success before confirming this transfer only.",
      "execution": {
        "invokeSaga": {
          "ref": {
            "sagaId": "fab-split",
            "version": "v1"
          },
          "args": [
            {
              "slot": "from",
              "ref": "input:from",
              "type": "LotId"
            },
            {
              "slot": "to",
              "ref": "input:to",
              "type": "LotId"
            },
            {
              "slot": "wafers",
              "ref": "input:wafers",
              "type": "WaferSet"
            },
            {
              "slot": "manifest",
              "ref": "input:manifest",
              "type": "ManifestRef"
            }
          ],
          "transactionIdentity": {
            "type": "TxId",
            "derivation": "durable-source-stage",
            "source": {
              "ref": "input:operation",
              "type": "OperationId"
            },
            "stageId": "split",
            "stageOccurrence": {
              "ref": "input:occurrence",
              "type": "OperationId"
            },
            "scope": "saga-version",
            "conflict": "reject-different-args"
          },
          "start": "durable-intent-before-start",
          "completionMode": "await-terminal",
          "results": [
            {
              "resultKind": "succeeded",
              "code": "Succeeded",
              "outputs": [
                {
                  "slot": "txid",
                  "ref": "result:txid",
                  "type": "TxId"
                }
              ]
            },
            {
              "resultKind": "rejected-before-effects",
              "code": "Rejected",
              "outputs": []
            },
            {
              "resultKind": "compensated",
              "code": "Compensated",
              "outputs": []
            },
            {
              "resultKind": "recovery-required",
              "code": "RecoveryRequired",
              "outputs": []
            },
            {
              "resultKind": "outcome-unknown",
              "code": "Unknown",
              "outputs": []
            }
          ]
        },
        "reads": [
          {
            "slot": "operation",
            "ref": "input:operation",
            "type": "OperationId"
          },
          {
            "slot": "occurrence",
            "ref": "input:occurrence",
            "type": "OperationId"
          },
          {
            "slot": "from",
            "ref": "input:from",
            "type": "LotId"
          },
          {
            "slot": "to",
            "ref": "input:to",
            "type": "LotId"
          },
          {
            "slot": "wafers",
            "ref": "input:wafers",
            "type": "WaferSet"
          },
          {
            "slot": "manifest",
            "ref": "input:manifest",
            "type": "ManifestRef"
          }
        ],
        "writes": [
          {
            "id": "txid",
            "slot": "txid",
            "type": "TxId",
            "durability": "durable-reference"
          }
        ],
        "outcomes": [
          {
            "code": "Succeeded",
            "kind": "success",
            "action": "continue"
          },
          {
            "code": "Rejected",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "Compensated",
            "kind": "business-rejection",
            "action": "stop"
          },
          {
            "code": "RecoveryRequired",
            "kind": "infrastructure-failure",
            "action": "manual-recovery"
          },
          {
            "code": "Unknown",
            "kind": "unknown-effect",
            "action": "manual-recovery"
          }
        ]
      }
    }
  ]
execution:
  {
    "schemaVersion": "truthsrc.execution/v1",
    "inputs": [
      {
        "id": "operation",
        "type": "OperationId",
        "durability": "start-record"
      },
      {
        "id": "occurrence",
        "type": "OperationId",
        "durability": "durable-reference"
      },
      {
        "id": "from",
        "type": "LotId",
        "durability": "start-record"
      },
      {
        "id": "to",
        "type": "LotId",
        "durability": "start-record"
      },
      {
        "id": "wafers",
        "type": "WaferSet",
        "durability": "start-record"
      },
      {
        "id": "manifest",
        "type": "ManifestRef",
        "durability": "start-record"
      }
    ],
    "outputs": [
      {
        "id": "txid",
        "ref": "step:split:txid",
        "type": "TxId"
      }
    ],
    "recovery": {
      "inputResponsibility": "host",
      "inputs": [
        "input:operation",
        "input:occurrence",
        "input:from",
        "input:to",
        "input:wafers",
        "input:manifest"
      ],
      "planVersion": "plan-v1",
      "planCompatibility": "exact",
      "checkpoint": "confirmed-prefix",
      "unknownEffect": "reconcile-before-resume",
      "ownership": "single-writer"
    },
    "admission": {
      "maxConcurrentRuns": 1,
      "maxInFlightSteps": 1,
      "maxItemsPerChunk": 64,
      "maxInFlightChunks": 1
    }
  }
