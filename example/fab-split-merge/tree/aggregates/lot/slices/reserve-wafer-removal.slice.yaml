# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: Lot
command: ReserveWaferRemoval
payload:
  {
    "name": "ReserveWaferRemoval",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "LotId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "wafers",
        "dataType": "WaferSet",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ReserveWaferRemovalConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-LOT-RESERVE-REMOVAL-001",
        "errCode": "61008",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "reservedRemovals",
          "key": "param.txid"
        },
        "desc": "Removal already reserved for this transaction: idempotent success, no events (mirror of golden master 60008 semantics)."
      },
      {
        "ruleId": "IR-LOT-RESERVE-REMOVAL-002",
        "errCode": "61003",
        "onFail": "reject",
        "when": {
          "form": "collection-covered",
          "map": "carried",
          "collection": "param.wafers"
        },
        "desc": "Source lot does not carry the full frozen wafer set (conservation precondition)."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "ReserveWaferRemovalConfirmed": {
      "name": "ReserveWaferRemovalConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "reservation",
          "dataType": "ReservationId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "wafers",
          "dataType": "WaferSet",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the frozen wafer set was reserved for removal under this transaction identity; the folds key the reservation by txid and lift the wafers out of the carried set.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "reservation",
          "expr": "receipt.reservation"
        },
        {
          "slot": "wafers",
          "expr": "param.wafers"
        }
      ],
      "foldAssignments": [
        {
          "slot": "reservedRemovals",
          "op": "put",
          "key": "event.txid",
          "value": "event.reservation"
        },
        {
          "slot": "carried",
          "op": "remove-all",
          "key": "event.wafers"
        }
      ]
    }
  }
