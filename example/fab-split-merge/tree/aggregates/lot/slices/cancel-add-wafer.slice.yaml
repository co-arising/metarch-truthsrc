# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: Lot
command: CancelAddWafer
payload:
  {
    "name": "CancelAddWafer",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "LotId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "CancelAddWaferConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-LOT-CANCEL-ADD-001",
        "errCode": "61009",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedAdditions",
          "key": "param.txid"
        },
        "desc": "Addition cannot be found or already canceled."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required. The reserved wafers were never carried, so cancellation only clears the reservation."
  }
events:
  {
    "CancelAddWaferConfirmed": {
      "name": "CancelAddWaferConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the reserved addition under this transaction identity was canceled; the folds mark the compensation and clear the reservation.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "compensated",
          "op": "put",
          "key": "event.txid",
          "value": "literal:canceled-addition"
        },
        {
          "slot": "reservedAdditions",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
