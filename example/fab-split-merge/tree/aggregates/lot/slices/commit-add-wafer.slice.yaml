# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: Lot
command: CommitAddWafer
payload:
  {
    "name": "CommitAddWafer",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "LotId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "wafers",
        "dataType": "WaferSet",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "CommitAddWaferConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-LOT-COMMIT-ADD-001",
        "errCode": "61008",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedAdditions",
          "key": "param.txid"
        },
        "desc": "Addition cannot be found or already committed."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required. The wafers come from this step's own prepare receipt (the frozen set that was reserved for addition)."
  }
events:
  {
    "CommitAddWaferConfirmed": {
      "name": "CommitAddWaferConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "receiptId",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "wafers",
          "dataType": "WaferSet",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the reserved addition under this transaction identity was committed; the folds mark the commit, carry the wafers into the lot and clear the reservation.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "receiptId",
          "expr": "receipt.receiptId"
        },
        {
          "slot": "wafers",
          "expr": "param.wafers"
        }
      ],
      "foldAssignments": [
        {
          "slot": "committed",
          "op": "put",
          "key": "event.txid",
          "value": "event.receiptId"
        },
        {
          "slot": "carried",
          "op": "put-all",
          "key": "event.wafers",
          "value": "literal:carried"
        },
        {
          "slot": "reservedAdditions",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
