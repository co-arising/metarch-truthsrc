# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: Lot
command: CommitWaferRemoval
payload:
  {
    "name": "CommitWaferRemoval",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "LotId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "CommitWaferRemovalConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-LOT-COMMIT-REMOVAL-001",
        "errCode": "61006",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedRemovals",
          "key": "param.txid"
        },
        "desc": "No reserved removal found for this transaction."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "CommitWaferRemovalConfirmed": {
      "name": "CommitWaferRemovalConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "receiptId",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the reserved wafer removal under this transaction identity was committed; the folds mark the commit and clear the reservation entry the txid names.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "receiptId",
          "expr": "receipt.receiptId"
        }
      ],
      "foldAssignments": [
        {
          "slot": "committed",
          "op": "put",
          "key": "event.txid",
          "value": "event.receiptId"
        },
        {
          "slot": "reservedRemovals",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
