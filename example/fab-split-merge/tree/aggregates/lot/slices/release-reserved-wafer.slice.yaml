# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: Lot
command: ReleaseReservedWafer
payload:
  {
    "name": "ReleaseReservedWafer",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "LotId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "wafers",
        "dataType": "WaferSet",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ReleaseReservedWaferConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-LOT-RELEASE-001",
        "errCode": "61006",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedRemovals",
          "key": "param.txid"
        },
        "desc": "No reserved removal found for this transaction."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required. The wafers come from this step's own prepare receipt — the aggregate holds no per-transaction wafer copy, so compensation replays the frozen set through the receipt context."
  }
events:
  {
    "ReleaseReservedWaferConfirmed": {
      "name": "ReleaseReservedWaferConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "wafers",
          "dataType": "WaferSet",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the reserved removal under this transaction identity was released; the folds put the frozen wafers back into the carried set and clear the reservation.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "wafers",
          "expr": "param.wafers"
        }
      ],
      "foldAssignments": [
        {
          "slot": "compensated",
          "op": "put",
          "key": "event.txid",
          "value": "literal:released-removal"
        },
        {
          "slot": "carried",
          "op": "put-all",
          "key": "event.wafers",
          "value": "literal:carried"
        },
        {
          "slot": "reservedRemovals",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
