# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: RecordResultSucceeded
payload:
  {
    "name": "RecordResultSucceeded",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "result-succeeded"
    ],
    "guards": [
      {
        "ruleId": "IR-CB-RESULT-001",
        "errCode": "60010",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "sagaResults",
          "key": "param.txid"
        },
        "desc": "Result already recorded for this transaction: idempotent republication success, no events (designed strict TCC outcome ledger 60010)."
      }
    ],
    "description": "Idempotent publication of the saga terminal outcome (kind succeeded) onto the aggregate journal; the host completion flow asks this command (result-publication convention, SCHEMA.md P5)."
  }
events:
  {
    "result-succeeded": {
      "name": "result-succeeded",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the saga terminated with outcome succeeded for this transaction identity; the fold records the kind in the sagaResults ledger.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "sagaResults",
          "op": "put",
          "key": "event.txid",
          "value": "literal:succeeded"
        }
      ]
    }
  }
