# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: RecordIncomingCredits
payload:
  {
    "name": "RecordIncomingCredits",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "amount",
        "dataType": "Money",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "RecordIncomingCreditsConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-CB-PREPARE-NOT-COMMITTED",
        "errCode": "60011",
        "onFail": "reject",
        "when": {
          "form": "map-absent",
          "map": "committed",
          "key": "param.txid"
        },
        "desc": "Transaction already committed: Prepare must not reopen the durable terminal marker."
      },
      {
        "ruleId": "IR-CB-PREPARE-NOT-COMPENSATED",
        "errCode": "60012",
        "onFail": "reject",
        "when": {
          "form": "map-absent",
          "map": "compensated",
          "key": "param.txid"
        },
        "desc": "Transaction already compensated: Prepare must not reopen the durable terminal marker."
      },
      {
        "ruleId": "IR-CB-RECORD-001",
        "errCode": "60007",
        "onFail": "reject",
        "when": {
          "form": "map-absent",
          "map": "incomingCredits",
          "key": "param.txid"
        },
        "desc": "Incoming credits already registered for this transaction (golden master 60007)."
      },
      {
        "ruleId": "IR-CB-RESERVE-003",
        "errCode": "60004",
        "onFail": "reject",
        "when": {
          "form": "money-positive",
          "amount": "param.amount"
        },
        "desc": "Transfer amount must be positive (golden master 60004)."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "RecordIncomingCreditsConfirmed": {
      "name": "RecordIncomingCreditsConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "amount",
          "dataType": "Money",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: incoming credits of the exact amount were recorded under the transaction identity; the state fold keys the entry by txid.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "amount",
          "expr": "param.amount"
        }
      ],
      "foldAssignments": [
        {
          "slot": "incomingCredits",
          "op": "put",
          "key": "event.txid",
          "value": "event.amount"
        }
      ]
    }
  }
