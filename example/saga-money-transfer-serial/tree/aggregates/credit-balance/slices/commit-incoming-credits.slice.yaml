# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: CommitIncomingCredits
payload:
  {
    "name": "CommitIncomingCredits",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "CommitIncomingCreditsConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-CB-COMMIT-001",
        "errCode": "60008",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "incomingCredits",
          "key": "param.txid"
        },
        "desc": "Incoming credits cannot be found or already committed (golden master 60008)."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "CommitIncomingCreditsConfirmed": {
      "name": "CommitIncomingCreditsConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the recorded incoming credits under this transaction identity were committed; the fold books the recorded amount into the balance and clears the entry.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "accountBalance",
          "op": "money-apply",
          "delta": "state.incomingCredits[event.txid]",
          "sign": 1
        },
        {
          "slot": "incomingCredits",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
