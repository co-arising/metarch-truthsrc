# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: ReserveFunds
payload:
  {
    "name": "ReserveFunds",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "amount",
        "dataType": "Money",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ReserveFundsConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-CB-RESERVE-001",
        "errCode": "60008",
        "onFail": "succeed-empty",
        "when": {
          "form": "map-absent",
          "map": "reservedAmount",
          "key": "param.txid"
        },
        "desc": "Already reserved for this transaction: idempotent success, no events (golden master 60008)."
      },
      {
        "ruleId": "IR-CB-RESERVE-002",
        "errCode": "60003",
        "onFail": "reject",
        "when": {
          "form": "money-sufficient",
          "amount": "param.amount",
          "in": "accountBalance"
        },
        "desc": "Insufficient balance for transfer (golden master 60003)."
      },
      {
        "ruleId": "IR-CB-RESERVE-003",
        "errCode": "60004",
        "onFail": "reject",
        "when": {
          "form": "money-positive",
          "amount": "param.amount"
        },
        "desc": "Transfer amount must be positive (golden master 60004)."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "ReserveFundsConfirmed": {
      "name": "ReserveFundsConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        },
        {
          "name": "amount",
          "dataType": "Money",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: funds of the exact amount were reserved under the transaction identity (golden master FundsReserved(transferId, amount)); the state fold keys the reservation by txid.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        },
        {
          "slot": "amount",
          "expr": "param.amount"
        }
      ],
      "foldAssignments": [
        {
          "slot": "accountBalance",
          "op": "money-apply",
          "delta": "event.amount",
          "sign": -1
        },
        {
          "slot": "reservedAmount",
          "op": "put",
          "key": "event.txid",
          "value": "event.amount"
        }
      ]
    }
  }
