# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: CreditBalance
command: ReleaseReservedFunds
payload:
  {
    "name": "ReleaseReservedFunds",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "resource",
        "dataType": "AccountId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "ReleaseReservedFundsConfirmed"
    ],
    "guards": [
      {
        "ruleId": "IR-CB-RELEASE-001",
        "errCode": "60006",
        "onFail": "reject",
        "when": {
          "form": "map-contains",
          "map": "reservedAmount",
          "key": "param.txid"
        },
        "desc": "No reserved funds found for this transaction (golden master 60006)."
      }
    ],
    "description": "Stable operation identity, exact payload compatibility and durable participant receipt required."
  }
events:
  {
    "ReleaseReservedFundsConfirmed": {
      "name": "ReleaseReservedFundsConfirmed",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "BUSINESS_INPUT"
        }
      ],
      "description": "Designed durable fact: the reservation under this transaction identity was released; the fold refunds the reserved amount it names back to the balance.",
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "compensated",
          "op": "put",
          "key": "event.txid",
          "value": "state.reservedAmount[event.txid]"
        },
        {
          "slot": "accountBalance",
          "op": "money-apply",
          "delta": "state.reservedAmount[event.txid]",
          "sign": 1
        },
        {
          "slot": "reservedAmount",
          "op": "remove",
          "key": "event.txid"
        }
      ]
    }
  }
