kind: saga
id: money-transfer
name: "Transfer exact money between two accounts"
seq: 0
version: v1
payload:
  {
    "schemaVersion": "truthsrc.saga/v1",
    "purpose": "Reserve outgoing and incoming amounts, commit only after the durable decision, then reconcile forward.",
    "invariants": [
      "Currency and exact minor units are conserved"
    ],
    "transactionIdType": "TxId",
    "args": [
      {
        "slot": "from",
        "type": "AccountId"
      },
      {
        "slot": "to",
        "type": "AccountId"
      },
      {
        "slot": "amount",
        "type": "Money"
      }
    ],
    "participants": [
      {
        "id": "source",
        "aggregate": "CreditBalance",
        "resourceRef": {
          "ref": "args:from",
          "type": "AccountId"
        }
      },
      {
        "id": "target",
        "aggregate": "CreditBalance",
        "resourceRef": {
          "ref": "args:to",
          "type": "AccountId"
        }
      }
    ],
    "groups": [
      {
        "id": 1,
        "dependsOn": []
      }
    ],
    "steps": [
      {
        "id": "reserve-source",
        "participant": "source",
        "group": 1,
        "phases": {
          "prepare": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "ReserveFunds"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:from",
                "type": "AccountId"
              },
              {
                "slot": "amount",
                "ref": "args:amount",
                "type": "Money"
              }
            ],
            "outputs": [
              {
                "slot": "reservation",
                "type": "ReservationId"
              }
            ]
          },
          "commit": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "DeductFunds"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:from",
                "type": "AccountId"
              },
              {
                "slot": "reservation",
                "ref": "step:reserve-source:prepare:reservation",
                "type": "ReservationId"
              }
            ],
            "outputs": [
              {
                "slot": "receiptId",
                "type": "TxId"
              }
            ]
          },
          "compensate": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "ReleaseReservedFunds"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:from",
                "type": "AccountId"
              },
              {
                "slot": "reservation",
                "ref": "step:reserve-source:prepare:reservation",
                "type": "ReservationId"
              }
            ],
            "outputs": []
          }
        }
      },
      {
        "id": "reserve-target",
        "participant": "target",
        "group": 1,
        "phases": {
          "prepare": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "RecordIncomingCredits"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:to",
                "type": "AccountId"
              },
              {
                "slot": "amount",
                "ref": "args:amount",
                "type": "Money"
              }
            ],
            "outputs": [
              {
                "slot": "reservation",
                "type": "ReservationId"
              }
            ]
          },
          "commit": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "CommitIncomingCredits"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:to",
                "type": "AccountId"
              },
              {
                "slot": "reservation",
                "ref": "step:reserve-target:prepare:reservation",
                "type": "ReservationId"
              }
            ],
            "outputs": [
              {
                "slot": "receiptId",
                "type": "TxId"
              }
            ]
          },
          "compensate": {
            "kind": "command",
            "commandRef": {
              "aggregate": "CreditBalance",
              "name": "CancelIncomingCredit"
            },
            "bindings": [
              {
                "slot": "txid",
                "ref": "txid",
                "type": "TxId"
              },
              {
                "slot": "resource",
                "ref": "args:to",
                "type": "AccountId"
              },
              {
                "slot": "reservation",
                "ref": "step:reserve-target:prepare:reservation",
                "type": "ReservationId"
              }
            ],
            "outputs": []
          }
        }
      }
    ],
    "resilience": {
      "maxAttempts": 3,
      "phaseTimeoutMs": 1000,
      "queryTimeoutMs": 500,
      "backoffMs": 100,
      "totalTimeoutMs": 10000
    },
    "safety": {
      "commitDecision": "durable-before-commit",
      "abortDecision": "durable-before-compensate",
      "afterCommit": "forward-recovery",
      "unknown": "reconcile-before-resume",
      "compensation": "confirmed-reservations",
      "cancelBeforePrepare": "empty-release-and-fence",
      "retryIdentity": "stable-operation",
      "manualRecovery": "authorized-reconciliation-evidence"
    },
    "admission": {
      "maxParticipants": 2,
      "maxInFlight": 2,
      "maxItemsPerChunk": 64,
      "manifest": {
        "mode": "static",
        "durable": true
      }
    },
    "triggers": [
      {
        "id": "from-command",
        "kind": "command",
        "sourceRef": {
          "aggregate": "CreditBalance",
          "name": "StartTransfer"
        },
        "argsMapping": [
          {
            "slot": "from",
            "ref": "source:from",
            "type": "AccountId"
          },
          {
            "slot": "to",
            "ref": "source:to",
            "type": "AccountId"
          },
          {
            "slot": "amount",
            "ref": "source:amount",
            "type": "Money"
          }
        ],
        "idempotency": {
          "ref": "source:operationId",
          "type": "OperationId",
          "scope": "saga-version",
          "conflict": "reject-different-args"
        }
      },
      {
        "id": "from-event",
        "kind": "event",
        "sourceRef": {
          "aggregate": "CreditBalance",
          "name": "TransferRequested"
        },
        "argsMapping": [
          {
            "slot": "from",
            "ref": "source:from",
            "type": "AccountId"
          },
          {
            "slot": "to",
            "ref": "source:to",
            "type": "AccountId"
          },
          {
            "slot": "amount",
            "ref": "source:amount",
            "type": "Money"
          }
        ],
        "idempotency": {
          "ref": "source:operationId",
          "type": "OperationId",
          "scope": "saga-version",
          "conflict": "reject-different-args"
        }
      }
    ],
    "resultKinds": [
      "succeeded",
      "rejected-before-effects",
      "compensated",
      "recovery-required",
      "outcome-unknown"
    ],
    "completions": [
      {
        "kind": "succeeded",
        "eventRef": {
          "aggregate": "CreditBalance",
          "name": "result-succeeded"
        },
        "bindings": [
          {
            "slot": "txid",
            "ref": "txid",
            "type": "TxId"
          }
        ]
      },
      {
        "kind": "rejected-before-effects",
        "eventRef": {
          "aggregate": "CreditBalance",
          "name": "result-rejected-before-effects"
        },
        "bindings": [
          {
            "slot": "txid",
            "ref": "txid",
            "type": "TxId"
          }
        ]
      },
      {
        "kind": "compensated",
        "eventRef": {
          "aggregate": "CreditBalance",
          "name": "result-compensated"
        },
        "bindings": [
          {
            "slot": "txid",
            "ref": "txid",
            "type": "TxId"
          }
        ]
      },
      {
        "kind": "recovery-required",
        "eventRef": {
          "aggregate": "CreditBalance",
          "name": "result-recovery-required"
        },
        "bindings": [
          {
            "slot": "txid",
            "ref": "txid",
            "type": "TxId"
          }
        ]
      },
      {
        "kind": "outcome-unknown",
        "eventRef": {
          "aggregate": "CreditBalance",
          "name": "result-outcome-unknown"
        },
        "bindings": [
          {
            "slot": "txid",
            "ref": "txid",
            "type": "TxId"
          }
        ]
      }
    ]
  }
