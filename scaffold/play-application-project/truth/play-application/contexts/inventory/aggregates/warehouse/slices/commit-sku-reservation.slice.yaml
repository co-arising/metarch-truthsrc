kind: slice
aggregate: Warehouse
command: CommitSkuReservation
payload:
  {
    "name": "CommitSkuReservation",
    "parameters": [
      {
        "name": "txid",
        "dataType": "TxId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "warehouseId",
        "dataType": "WarehouseId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "skuId",
        "dataType": "SkuId",
        "origin": "BUSINESS_INPUT"
      },
      {
        "name": "reservationId",
        "dataType": "ReservationId",
        "origin": "BUSINESS_INPUT"
      }
    ],
    "produces": [
      "SkuReservationCommitted"
    ],
    "guards": [
      {
        "ruleId": "commit-receipt-absent",
        "errCode": "receipt-present",
        "when": {
          "form": "map-absent",
          "map": "receipts",
          "key": "param.txid"
        },
        "onFail": "succeed-empty",
        "desc": "New sample guard: an existing commit receipt is an empty success."
      }
    ]
  }
events:
  {
    "SkuReservationCommitted": {
      "name": "SkuReservationCommitted",
      "payloads": [
        {
          "name": "txid",
          "dataType": "TxId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "txid",
          "expr": "param.txid"
        }
      ],
      "foldAssignments": [
        {
          "slot": "receipts",
          "op": "put",
          "key": "event.txid",
          "value": "literal:SkuReservationCommitted"
        }
      ]
    }
  }
