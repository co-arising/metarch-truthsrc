  {
    "Reserved": {
      "name": "Reserved",
      "payloads": [
        {
          "name": "type",
          "dataType": "TicketId",
          "origin": "PROPAGATED"
        }
      ],
      "bindings": [
        {
          "slot": "type",
          "expr": "param.type"
        }
      ],
      "foldAssignments": [
        {
          "slot": "type",
          "expr": "event.type"
        },
        {
          "slot": "reserved",
          "expr": "literal:true"
        }
      ]
    }
  }
