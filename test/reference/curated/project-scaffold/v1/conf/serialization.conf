akka.actor.allow-java-serialization = off
akka.actor.warn-about-java-serializer-usage = on

akka.actor.serializers {
  proto = "akka.remote.serialization.ProtobufSerializer"
  domainProto0 = "example.bankwealth.infrastructure.persistence.DomainProtoSerializer"
  strict-saga = "net.imadz.infra.saga.strict.StrictSagaSerializer"
  host0 = "example.bankwealth.infrastructure.persistence.BankPaymentHostSerializer"
  host1 = "example.bankwealth.infrastructure.persistence.BankRefundHostSerializer"
  effect0 = "example.bankwealth.infrastructure.persistence.BankSipDispatchEffectHostSerializer"
  effect1 = "example.bankwealth.infrastructure.persistence.BankTaEffectHostSerializer"
}

akka.actor.serialization-bindings {
  "net.imadz.common.CborSerializable" = jackson-cbor
  "com.google.protobuf.Message" = proto
  "scalapb.GeneratedMessage" = domainProto0
  "scalapb.GeneratedOneof" = domainProto0
  "net.imadz.infra.saga.strict.StrictDurable" = strict-saga
  "example.bankwealth.application.process.BankPaymentHost$Event" = host0
  "example.bankwealth.application.process.BankRefundHost$Event" = host1
  "example.bankwealth.application.connectors.BankSipDispatchEffectHost$Event" = effect0
  "example.bankwealth.application.connectors.BankTaEffectHost$Event" = effect1
}
