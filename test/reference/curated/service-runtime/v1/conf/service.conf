play.application.loader = "example.bankwealth.infrastructure.bootstrap.BankServiceLoader"
play.http.secret.key = ${PLAY_SECRET}
service.connections."bank-mongo-connection" = ${MONGO_URI}
service.connections."bank-mysql-connection" = ${MYSQL_JDBC_URL}
akka.persistence.journal.plugin = "akka-contrib-mongodb-persistence-journal"
akka.persistence.snapshot-store.plugin = "akka-contrib-mongodb-persistence-snapshot"
akka.contrib.persistence.mongodb.mongo.mongouri = ${service.connections."bank-mongo-connection"}
db.default.driver = "com.mysql.cj.jdbc.Driver"
db.default.url = ${service.connections."bank-mysql-connection"}
db.default.username = ${MYSQL_USER}
db.default.password = ${MYSQL_PASSWORD}
