syntax = "proto3";

import "scalapb/scalapb.proto";
import "shared_value_objects.proto";

package example.bankwealth.infrastructure.executionproto;

option (scalapb.options) = { flat_package: true };

message banktasubmissionv1ExecutionStatePB {
  string planversion = 1;
  .example.bankwealth.infrastructure.proto.TaRequestIdPO input0 = 2;
  .example.bankwealth.infrastructure.proto.FundOrderIdPO input1 = 3;
  .example.bankwealth.infrastructure.proto.TxIdPO input2 = 4;
  .example.bankwealth.infrastructure.proto.TaRequestIdPO output0 = 5;
}
