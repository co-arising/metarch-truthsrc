syntax = "proto3";

import "scalapb/scalapb.proto";
import "shared_value_objects.proto";

package example.bankwealth.infrastructure.executionproto;

option (scalapb.options) = { flat_package: true };

message bankindependentrefundv1ExecutionStatePB {
  string planversion = 1;
  .example.bankwealth.infrastructure.proto.FundOrderIdPO input0 = 2;
  .example.bankwealth.infrastructure.proto.TxIdPO input1 = 3;
  .example.bankwealth.infrastructure.proto.AccountIdPO input2 = 4;
  .example.bankwealth.infrastructure.proto.AccountIdPO input3 = 5;
  .example.bankwealth.infrastructure.proto.MoneyPO input4 = 6;
  .example.bankwealth.infrastructure.proto.OperationIdPO input5 = 7;
  .example.bankwealth.infrastructure.proto.TxIdPO output0 = 8;
}
