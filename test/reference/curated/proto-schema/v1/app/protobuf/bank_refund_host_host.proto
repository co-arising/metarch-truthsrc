syntax = "proto3";

import "scalapb/scalapb.proto";

package example.bankwealth.infrastructure.hostproto;

option (scalapb.options) = { flat_package: true };

message bankrefundhostHostEventPB {
  string kind = 1;
  bytes original = 2;
  bytes args = 3;
  string operation = 4;
  bytes identity = 5;
}
