syntax = "proto3";

import "scalapb/scalapb.proto";
import "shared_value_objects.proto";

package example.bankwealth.infrastructure.executionproto;

option (scalapb.options) = { flat_package: true };

message bankcashpaymentv1ExecutionStatePB {
  string planversion = 1;
  .example.bankwealth.infrastructure.proto.OperationIdPO input0 = 2;
  .example.bankwealth.infrastructure.proto.OperationIdPO input1 = 3;
  .example.bankwealth.infrastructure.proto.AccountIdPO input2 = 4;
  .example.bankwealth.infrastructure.proto.FundOrderIdPO input3 = 5;
  .example.bankwealth.infrastructure.proto.AccountIdPO input4 = 6;
  .example.bankwealth.infrastructure.proto.MoneyPO input5 = 7;
  optional string input6 = 8;
  .example.bankwealth.infrastructure.proto.TxIdPO output0 = 9;
}
