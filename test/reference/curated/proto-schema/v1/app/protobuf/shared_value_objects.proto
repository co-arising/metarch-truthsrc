syntax = "proto3";

import "scalapb/scalapb.proto";

package example.bankwealth.infrastructure.proto;

option (scalapb.options) = { flat_package: true };

message AccountIdPO {
  string value = 1;
}

message FundOrderIdPO {
  string value = 1;
}

message OperationIdPO {
  string value = 1;
}

message TxIdPO {
  string value = 1;
}

message PlanIdPO {
  string value = 1;
}

message RevisionIdPO {
  string value = 1;
}

message OccurrenceIdPO {
