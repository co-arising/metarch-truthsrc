message BankOrderViewPO {
  FundOrderIdPO orderId = 1;
  OperationIdPO operationId = 2;
  AccountIdPO investorAccountId = 3;
  AccountIdPO fundCollectionAccountId = 4;
  string fundCode = 5;
  MoneyWirePO amount = 6;
  TxIdPO paymentTxId = 7;
  string paymentStatus = 8;
  TaRequestIdPO taRequestId = 9;
  string taStatus = 10;
  optional string taReference = 11;
  BankTaSharesViewPO taShares = 12;
  optional string taRejectionReason = 13;
  OperationIdPO refundOperationId = 14;
  string refundStatus = 15;
}

message BankSipRevisionViewPO {
  SipRevisionConfigPO config = 1;
  optional sint64 endSlot = 2;
}

message BankSipPlanViewPO {
  PlanIdPO planId = 1;
  BankSipCreateIntentPO original = 2;
  bool initialized = 3;
  bool scheduleSealed = 4;
  bool paused = 5;
  sint64 currentTick = 6;
  repeated sint64 dueSlots = 7;
  repeated BankSipRevisionViewPO revisions = 8;
  sint64 scheduleCount = 9;
  sint64 observedCount = 10;
  sint64 startCount = 11;
  sint64 successTotal = 12;
  sint64 failureTotal = 13;
}

message BankSipOccurrenceViewPO {
  SipOccurrencePO occurrence = 1;
  string slotDisposition = 2;
  string progress = 3;
  string paymentStatus = 4;
  string taStatus = 5;
  string refundStatus = 6;
  optional string firstTerminal = 7;
}

message BankPendingOperationViewPO {
  OperationIdPO operationId = 1;
  string flow = 2;
  FundOrderIdPO orderId = 3;
  PlanIdPO planId = 4;
  OccurrenceIdPO occurrenceId = 5;
  string phase = 6;
  string status = 7;
  bool recoverable = 8;
}

message BankAccountResponsePO {
