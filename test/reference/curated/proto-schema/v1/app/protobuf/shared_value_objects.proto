  optional sint64 nextAfter = 3;
}

message BankPendingResponsePO {
  BankReadMetadataPO metadata = 1;
  repeated BankPendingOperationViewPO operations = 2;
  optional sint64 nextAfter = 3;
}

message BankRecoveryAcknowledgementPO {
