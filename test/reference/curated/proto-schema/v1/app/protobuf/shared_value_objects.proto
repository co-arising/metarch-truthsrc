}

message SipRevisionConfigPO {
  RevisionIdPO revision = 1;
  sint64 effectiveSlot = 2;
  AccountIdPO investorAccountId = 3;
  AccountIdPO fundCollectionAccountId = 4;
  string fundCode = 5;
  MoneyPO amount = 6;
}

message SipOccurrencePO {
  PlanIdPO planId = 1;
  RevisionIdPO revision = 2;
  sint64 dueSlot = 3;
  OccurrenceIdPO occurrenceId = 4;
  OperationIdPO operationId = 5;
  FundOrderIdPO fundOrderId = 6;
  SipRevisionConfigPO config = 7;
}

message TaReceiptPO {
  FundOrderIdPO fundOrderId = 1;
  TxIdPO paymentTxId = 2;
  TaRequestIdPO taRequestId = 3;
  AccountIdPO investorAccountId = 4;
  AccountIdPO fundCollectionAccountId = 5;
  string fundCode = 6;
  MoneyPO amount = 7;
  AmountDecimalPO principal = 8;
  string receiptId = 9;
  string receiptBody = 10;
  string taReference = 11;
  string status = 12;
  TaExactTextPO shares = 13;
  TaExactTextPO nav = 14;
  string reason = 15;
}

message BankPaymentOriginalPO {
